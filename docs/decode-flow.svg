<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="minified code becomes readable code and an API list">
  <defs>
    <radialGradient id="g" cx="82%" cy="30%" r="80%">
      <stop offset="0" stop-color="#3A0E18"/>
      <stop offset="1" stop-color="#0B0C0F"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1280" height="300" rx="18" fill="url(#g)"/>
  <rect x=".5" y=".5" width="1279" height="299" rx="18" fill="none" stroke="#2A2E36"/>

  <!-- minified: tangled -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#8E91A0" opacity=".75">
    <text x="48" y="64">!function(e,t){var n=e.a,r=t.b;return n?(r(),!0):void 0}</text>
    <text x="48" y="96">const O={a:e=>U("GET",`/x/${e}`),b:()=>U("POST","/y")}</text>
    <text x="48" y="128">e=>{e.preventDefault(),t(!0),n(e.target.value)}</text>
    <text x="48" y="160">function F({name:e,size:t=20}){return i.jsx("svg",{})}</text>
    <text x="48" y="192">a?b():c(),d&amp;&amp;e(),f=!1,g=void 0;</text>
  </g>
  <text x="48" y="256" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#8E91A0">MINIFIED BUNDLE</text>

  <!-- arrow -->
  <path d="M590 150 H680" stroke="#E8334A" stroke-width="6" stroke-linecap="round"/>
  <path d="M664 132 L686 150 L664 168" fill="none" stroke="#E8334A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- readable -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#F5F5F7">
    <text x="720" y="82" fill="#FF5C6E">GET</text><text x="778" y="82">/v1/orders</text>
    <text x="720" y="118" fill="#FF5C6E">POST</text><text x="790" y="118">/v1/session</text>
    <text x="720" y="154" fill="#FF5C6E">PUT</text><text x="778" y="154">/v1/profile</text>
    <text x="720" y="190" fill="#B8BAC4">body: { token, locale }</text>
  </g>
  <text x="720" y="256" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#FF5C6E">READABLE CODE + API MAP</text>

  <!-- pixels -->
  <g fill="#F5F5F7">
    <rect x="1130" y="60" width="10" height="10" opacity=".35"/><rect x="1166" y="104" width="8" height="8" opacity=".25"/>
    <rect x="1100" y="140" width="12" height="12" opacity=".2"/><rect x="1200" y="170" width="9" height="9" opacity=".3"/>
    <rect x="1150" y="214" width="7" height="7" opacity=".2"/><rect x="1226" y="90" width="6" height="6" opacity=".25"/>
  </g>
  <rect x="1180" y="58" width="12" height="12" fill="#E8334A" filter="url(#glow)"/>
  <rect x="1180" y="58" width="12" height="12" fill="#E8334A"/>
</svg>
